name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode at $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build and test
        run: |
          xcodebuild test \
            -project DanceProgressionJournal.xcodeproj \
            -scheme DanceProgressionJournal \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Show crash reports on failure
        if: failure()
        run: |
          echo "--- DiagnosticReports ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20
          echo "--- Newest app crash report ---"
          NEWEST=$(ls -t ~/Library/Logs/DiagnosticReports/DanceProgressionJournal*.ips 2>/dev/null | head -1)
          if [ -n "$NEWEST" ]; then
            python3 - "$NEWEST" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          d, _ = json.JSONDecoder().raw_decode(raw)
          print("exception:", d.get("exception", {}).get("type"), d.get("exception", {}).get("signal"))
          print("termination:", d.get("termination", {}))
          for t in d.get("threads", []):
              if t.get("triggered"):
                  print("crashed thread:", t.get("id"))
                  for f in t.get("frames", [])[:25]:
                      print(" ", f.get("symbol"), "|", f.get("image"), "+", f.get("offset"))
          PY
          fi
