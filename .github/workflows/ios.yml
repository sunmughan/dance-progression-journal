name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode at $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build and test
        run: |
          xcodebuild test \
            -project DanceProgressionJournal.xcodeproj \
            -scheme DanceProgressionJournal \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Show crash reports on failure
        if: failure()
        run: |
          echo "--- DiagnosticReports ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20
          echo "--- Newest app crash report ---"
          NEWEST=$(ls -t ~/Library/Logs/DiagnosticReports/DanceProgressionJournal*.ips 2>/dev/null | head -1)
          if [ -n "$NEWEST" ]; then
            python3 - "$NEWEST" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          dec = json.JSONDecoder()
          objs, idx = [], 0
          while idx < len(raw):
              try:
                  obj, end = dec.raw_decode(raw, idx)
                  objs.append(obj)
                  idx = end
              except json.JSONDecodeError:
                  idx += 1
          print("json objects:", len(objs), "top keys:", [sorted(o.keys())[:8] if isinstance(o, dict) else type(o).__name__ for o in objs])
          for d in objs:
              if not isinstance(d, dict) or "threads" not in d:
                  continue
              ex = d.get("exception", {})
              print("exception:", ex.get("type"), ex.get("signal"), ex.get("codes"))
              print("termination:", d.get("termination", {}))
              print("diagnosis:", d.get("diagnosis"))
              print("asi:", d.get("asi"))
              print("lastExceptionBacktrace:", d.get("lastExceptionBacktrace"))
              for t in d.get("threads", []):
                  if t.get("triggered"):
                      print("crashed thread:", t.get("id"), t.get("name"))
                      print("usedImages sample:", [im.get("name") for im in d.get("usedImages", [])[:12]])
                      for f in t.get("frames", [])[:8]:
                          print("RAWFRAME:", json.dumps(f))
          PY
          fi
